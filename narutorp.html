<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>NarutoRP - Chargement Immersif</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #06060e;
            color: #e6e6f0;
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(8, 8, 16, 0.9) 0%, rgba(15, 12, 24, 0.75) 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 56px;
            font-weight: 900;
            color: #ff9b28;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 25px rgba(220, 90, 20, 0.5);
        }

        .header p {
            color: #a0a0b0;
            font-size: 14px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-panels {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: 55vh;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            gap: 40px;
        }

        .panel {
            flex: 1;
            background: rgba(14, 14, 26, 0.65);
            border: 1px solid rgba(255, 155, 40, 0.15);
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            font-size: 20px;
            color: #ff9b28;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(220, 90, 20, 0.3);
            padding-bottom: 8px;
        }

        .lore-container {
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.7;
            color: #d1d1e0;
        }

        .founders-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(25, 25, 45, 0.5);
            border-left: 4px solid #dc5a14;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .avatar-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #747f8d;
            border: 2px solid #19192d;
        }

        .status-dot.online { background: #43b581; }
        .status-dot.idle { background: #faa61a; }
        .status-dot.dnd { background: #f04747; }

        .card-info h3 {
            font-size: 18px;
        }

        .discord-section {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .discord-card {
            width: 520px;
            min-height: 95px;
            background: rgba(88,101,242,0.18);
            border: 2px solid rgba(88,101,242,0.45);
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 30px;
            text-decoration: none;
            backdrop-filter: blur(12px);
            transition: 0.25s;
        }

        .discord-card:hover {
            transform: scale(1.04);
            background: rgba(88,101,242,0.28);
        }

        .discord-icon {
            width: 60px;
            height: 60px;
            background: #5865F2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .discord-icon img {
            width: 30px;
            filter: brightness(0) invert(1);
        }

        .discord-info h3 {
            color: white;
            font-size: 22px;
        }

        .discord-info p {
            color: #d8dcff;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="overlay"></div>

<div class="content">

    <div class="header">
        <h1>NINJA WORLD</h1>
        <p>Une nouvelle ère shinobi commence</p>
    </div>

    <div class="main-panels">

        <div class="panel">
            <h2>📜 Chroniques du Serveur</h2>
            <div class="lore-container">
                <p>Après des décennies de guerres...</p>
            </div>
        </div>

        <div class="panel">
            <h2>👥 Équipe Fondatrice</h2>

            <div class="founders-list">

                <div class="card">
                    <div class="avatar-wrapper">
                        <div class="avatar-container">
                            <img id="avatar-1">
                        </div>
                        <div id="status-1" class="status-dot"></div>
                    </div>
                    <div class="card-info">
                        <h3 id="name-1">Grimace</h3>
                        <p>Fondateur</p>
                    </div>
                </div>

                <div class="card">
                    <div class="avatar-wrapper">
                        <div class="avatar-container">
                            <img id="avatar-2">
                        </div>
                        <div id="status-2" class="status-dot"></div>
                    </div>
                    <div class="card-info">
                        <h3 id="name-2">Laiz</h3>
                        <p>Fondateur</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- DISCORD -->
    <div class="discord-section">
        <a class="discord-card" href="https://discord.gg/G6mhzgqNGT" target="_blank">

            <div class="discord-icon">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg">
            </div>

            <div class="discord-info">
                <h3>NRP WRLD</h3>
                <p>Rejoindre le Discord !</p>
            </div>

        </a>
    </div>

</div>

<script>
const DISCORD_ID_1 = "1250216139775016980";
const DISCORD_ID_2 = "1387497342353018891";

function fetchDiscordUser(userId, num) {
    fetch(`https://api.lanyard.rest/v1/users/${userId}`)
        .then(r => r.json())
        .then(res => {
            if (!res.success) return;

            const user = res.data.discord_user;
            const status = res.data.discord_status;

            document.getElementById(`name-${num}`).innerText = user.global_name || user.username;

            document.getElementById(`avatar-${num}`).src =
                `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

            document.getElementById(`status-${num}`).className = "status-dot " + status;
        });
}

fetchDiscordUser(DISCORD_ID_1, 1);
fetchDiscordUser(DISCORD_ID_2, 2);
</script>

</body>
</html>
